<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240">
  <defs>
    <!-- hookable dirt with grass edge -->
    <pattern id="ceil" width="32" height="32" patternUnits="userSpaceOnUse">
      <rect width="32" height="32" fill="#6b4a2b"/>
      <circle cx="8" cy="10" r="3" fill="#5a3d22"/>
      <circle cx="23" cy="18" r="4" fill="#5a3d22"/>
      <circle cx="14" cy="24" r="2" fill="#7d5834"/>
      <rect y="26" width="32" height="6" fill="#4f9a3a"/>
      <rect y="26" width="32" height="2" fill="#6cc24f"/>
    </pattern>
    <pattern id="floor" width="32" height="32" patternUnits="userSpaceOnUse">
      <rect width="32" height="32" fill="#6b4a2b"/>
      <circle cx="10" cy="20" r="4" fill="#5a3d22"/>
      <circle cx="25" cy="12" r="3" fill="#5a3d22"/>
      <rect width="32" height="6" fill="#4f9a3a"/>
      <rect y="4" width="32" height="2" fill="#3d7a2c"/>
    </pattern>
    <!-- freeze -->
    <pattern id="freeze" width="32" height="32" patternUnits="userSpaceOnUse">
      <rect width="32" height="32" fill="#1b3f66" fill-opacity=".75"/>
      <path d="M-4 12 L12 -4 M-4 28 L28 -4 M4 36 L36 4 M20 36 L36 20" stroke="#9fdcff" stroke-opacity=".35" stroke-width="2"/>
    </pattern>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#18203a"/>
    </linearGradient>
    <clipPath id="bodyclip"><circle cx="0" cy="-4" r="19"/></clipPath>
    <style>
      .t { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
      .cur { animation: cur 1s steps(1) infinite; }
      @keyframes cur { 50% { opacity: 0; } }
      .ice { animation: shimmer 3s ease-in-out infinite alternate; }
      @keyframes shimmer { from { opacity: .65; } to { opacity: 1; } }
    </style>
  </defs>

  <rect width="900" height="240" rx="12" fill="url(#bg)"/>
  <rect width="900" height="32" fill="url(#ceil)"/>
  <rect y="208" width="544" height="32" fill="url(#floor)"/>
  <rect class="ice" x="544" y="208" width="356" height="32" fill="url(#freeze)"/>

  <text class="t" x="40" y="100" font-size="52" font-weight="700" fill="#e6edf3">ILA-dd</text>
  <text class="t" x="42" y="134" font-size="17" fill="#a78bfa">low-level enjoyer · arch btw</text>
  <text class="t" x="42" y="170" font-size="15" fill="#7d8590">$ ./DDNet --connect hook-swing-segfault<tspan class="cur" fill="#e6edf3">█</tspan></text>

  <!-- the chain swings around the hook point; the tee stays upright like in-game -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-38 690 32; 38 690 32; -38 690 32" keyTimes="0;.5;1" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1" dur="5.2s" repeatCount="indefinite"/>
    <line x1="690" y1="32" x2="690" y2="160" stroke="#2b2b2b" stroke-width="6" stroke-linecap="round" stroke-dasharray="7 3"/>
    <line x1="690" y1="32" x2="690" y2="160" stroke="#b8b8b8" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 3"/>
    <path d="M682 40 L690 30 L698 40" fill="none" stroke="#2b2b2b" stroke-width="5" stroke-linejoin="round"/>
    <path d="M682 40 L690 30 L698 40" fill="none" stroke="#d0d0d0" stroke-width="2.5" stroke-linejoin="round"/>

    <g>
      <animateTransform attributeName="transform" type="rotate" values="38 690 160; -38 690 160; 38 690 160" keyTimes="0;.5;1" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1" dur="5.2s" repeatCount="indefinite"/>
      <!-- tee, default skin colours, 0.6 renderer proportions (BaseSize 64, scaled) -->
      <g transform="translate(690 160) scale(1.6)">
        <!-- outlines: back foot, body, front foot -->
        <ellipse cx="-7" cy="10" rx="13.6" ry="7.6" fill="#000"/>
        <circle cx="0" cy="-4" r="20.6" fill="#000"/>
        <ellipse cx="7" cy="10" rx="13.6" ry="7.6" fill="#000"/>
        <!-- back foot -->
        <ellipse cx="-7" cy="10" rx="12" ry="6" fill="#a67e33"/>
        <!-- body with the bottom-right shade -->
        <g clip-path="url(#bodyclip)">
          <circle cx="0" cy="-4" r="19" fill="#ab8954"/>
          <circle cx="-2.4" cy="-6.6" r="18.6" fill="#c3a267"/>
        </g>
        <!-- eyes look the way the tee flies -->
        <g>
          <animateTransform attributeName="transform" type="translate" values="-8 0;-8 0;8 0;8 0;-8 0" keyTimes="0;.47;.53;.97;1" dur="5.2s" repeatCount="indefinite"/>
          <ellipse cx="-4.2" cy="-7.2" rx="2.7" ry="5.2" fill="#000">
            <animate attributeName="ry" values="5.2;5.2;1;5.2" keyTimes="0;.9;.95;1" dur="3.7s" repeatCount="indefinite"/>
          </ellipse>
          <ellipse cx="4.2" cy="-7.2" rx="2.7" ry="5.2" fill="#000">
            <animate attributeName="ry" values="5.2;5.2;1;5.2" keyTimes="0;.9;.95;1" dur="3.7s" repeatCount="indefinite"/>
          </ellipse>
        </g>
        <!-- front foot -->
        <ellipse cx="7" cy="10" rx="12" ry="6" fill="#a67e33"/>
      </g>
    </g>
  </g>
</svg>
